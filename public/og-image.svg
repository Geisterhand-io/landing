<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <linearGradient id="ghost-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Gradient orbs -->
  <circle cx="200" cy="150" r="300" fill="#3b82f6" opacity="0.1" filter="url(#glow)"/>
  <circle cx="1000" cy="500" r="250" fill="#8b5cf6" opacity="0.1" filter="url(#glow)"/>

  <!-- Ghost logo -->
  <g transform="translate(520, 150) scale(3)">
    <path d="M16 2C9.373 2 4 7.373 4 14v12c0 1.5 1.5 2.5 2.8 1.8l1.7-1.3 2 1.5c.6.4 1.4.4 2 0l2-1.5 2 1.5c.6.4 1.4.4 2 0l2-1.5 1.7 1.3c1.3.7 2.8-.3 2.8-1.8V14c0-6.627-5.373-12-12-12z" fill="url(#ghost-gradient)" opacity="0.9"/>
    <path d="M12 12v8c0 .5.4 1 1 1s1-.5 1-1v-6h1v7c0 .5.4 1 1 1s1-.5 1-1v-7h1v5c0 .5.4 1 1 1s1-.5 1-1v-5h1v3c0 .5.4 1 1 1s1-.5 1-1v-5c0-2-1.5-3-3-3h-4c-1.5 0-3 1-3 3z" fill="#f8f8f8" opacity="0.95"/>
    <circle cx="11" cy="11" r="2" fill="#0a0a0a"/>
    <circle cx="19" cy="11" r="2" fill="#0a0a0a"/>
  </g>

  <!-- Title -->
  <text x="600" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, system-ui, sans-serif" font-size="72" font-weight="700" fill="#f8f8f8">
    Geisterhand
  </text>

  <!-- Subtitle -->
  <text x="600" y="480" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, system-ui, sans-serif" font-size="28" fill="#a0a0a0">
    AI-Powered Mac App Testing
  </text>

  <!-- Tagline -->
  <text x="600" y="530" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, system-ui, sans-serif" font-size="20" fill="#3b82f6">
    Test Mac Apps Like Magic
  </text>
</svg>
